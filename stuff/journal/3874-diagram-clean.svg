<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" width="1240" height="760" role="img" aria-labelledby="ttl desc">
<title id="ttl">Actualization = becoming full rank</title>
<desc id="desc">Two nested regions in the space of life and the universe. On the left, my subspace contains my column space, with my nullspace as the surrounding band. On the right, the collective perceived world contains my rowspace or action space, with the perceived nullspace — dissipation — as the surrounding band. A carries the left into the right; A transpose carries it back.</desc>
