<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 790" width="1400" height="790" role="img" aria-labelledby="ttl desc">
<title id="ttl">The space of life and the universe</title>
<desc id="desc">Two nested regions. On the left, my subspace — the latent space that my thoughts take form in — holds my column space, experiences injested into thoughts and ideas by me, with my nullspace as the band around it: experiences and perceptions that are unfathomable to me. On the right, the collective perceived world, still only understood by me through a transformation, holds my rowspace or action space, the responses I present and actualize from my thoughts, with the perceived nullspace as the band around it: ideas and thoughts unable to manifest in this world. A carries the left into the right; A transpose carries it back.</desc>
